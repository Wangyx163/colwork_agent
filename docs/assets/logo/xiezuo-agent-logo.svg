<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Xiezuo Agent logo">
  <!-- compact app/fav icon: collaboration inputs -> human gate -> approved action -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#FCFCFB"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25"
        fill="none" stroke="#D6DBDF" stroke-width="1.5"/>

  <!-- two collaborators / two contribution streams -->
  <circle cx="13" cy="21" r="4.5" fill="#2C5D7C"/>
  <circle cx="13" cy="43" r="4.5" fill="#2C5D7C"/>
  <path d="M17.5 21 C23.5 21 25.5 25 29.5 28.5"
        fill="none" stroke="#2C5D7C" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M17.5 43 C23.5 43 25.5 39 29.5 35.5"
        fill="none" stroke="#2C5D7C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- human decision gate -->
  <circle cx="32" cy="32" r="7" fill="#B0781C"/>
  <circle cx="32" cy="32" r="2.2" fill="#FCFCFB"/>

  <!-- accepted / released result -->
  <path d="M37 33.5 L43 40 L54 22"
        fill="none" stroke="#2C5D7C" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
